# Local development.
#
# `make dev` brings up Postgres and Redis in containers, but the application only
# genuinely needs the first. Running the API against a native Postgres with no
# Redis at all is a supported setup -- and the common one on a machine without
# Docker.
management:
  health:
    # Off here, unlike prod, and the asymmetry is the point.
    #
    # In production Redis exists and should be watched, so the contributor is on
    # and merely kept out of the readiness group. In development it frequently
    # does not exist, and its absence changes nothing: the rate limiter is its
    # only caller and fails open or closed by policy either way.
    #
    # Left enabled, `/actuator/health` returns 503 with `redis: DOWN` on a
    # perfectly working local setup, which teaches whoever sees it that the
    # health endpoint is noise. A check that is red when nothing is wrong is
    # worse than no check.
    redis:
      enabled: false

plotted:
  security:
    jwt:
      # Plain HTTP on localhost, so the Secure attribute would stop the browser
      # storing the refresh cookie at all.
      refresh-cookie-secure: false
  outbox:
    relay:
      # The scheduled poller is off here, and on by default everywhere else.
      #
      # It is a background thread querying the database every few seconds, and
      # the integration tests are Testcontainers-backed: the poller outlives the
      # container its Spring context was wired to and then spends the rest of the
      # run failing to connect. That is noise at best, and at worst it is nine
      # tests failing for a reason that has nothing to do with what they assert.
      #
      # Nothing is lost by turning it off. `OutboxRelayIntegrationTest` drives
      # `claim` and the settle methods directly, and `OutboxRelayTest` drives
      # `drain` -- so the scheduling annotation is the only part not exercised,
      # and it is one line of configuration rather than logic.
      enabled: false

logging:
  level:
    app.plotted: DEBUG
    org.jooq.tools.LoggerListener: DEBUG

management:
  endpoint:
    health:
      show-details: always
