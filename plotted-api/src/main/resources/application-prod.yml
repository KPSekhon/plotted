# Production. Every secret arrives from the environment (Google Secret Manager
# injected as env vars by Cloud Run); nothing sensitive is committed.
spring:
  datasource:
    hikari:
      # Scale-to-zero Cloud Run with a serverless Postgres: keep the pool small so
      # a cold start does not open more connections than the free tier allows.
      maximum-pool-size: 5
      minimum-idle: 0

plotted:
  security:
    jwt:
      refresh-cookie-secure: true

management:
  health:
    # Back on, in the change that gave Redis its first caller -- the phase 11 rate
    # limiter. It was off because a health check on a component with no callers
    # can only ever be noise, and a disabled check that outlives its reason is how
    # a dependency stops being monitored.
    redis:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness is "can this instance serve traffic", and it can serve almost
        # all of it without Redis: every read, every write, both headline
        # features. What it loses is rate limiting, which fails open where that is
        # safe and refuses the one endpoint where it is not.
        #
        # So Redis is monitored and deliberately *not* in this group. Including it
        # would mean a Redis outage removing every instance from the load
        # balancer -- turning a degraded limiter into a total outage, which is a
        # worse failure than the one the check exists to warn about.
        readiness:
          include: readinessState,db
        liveness:
          include: livenessState

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    app.plotted: INFO
