# Production. Every secret arrives from the environment (Google Secret Manager
# injected as env vars by Cloud Run); nothing sensitive is committed.
spring:
  datasource:
    hikari:
      # Scale-to-zero Cloud Run with a serverless Postgres: keep the pool small so
      # a cold start does not open more connections than the free tier allows.
      maximum-pool-size: 5
      minimum-idle: 0

plotted:
  security:
    jwt:
      refresh-cookie-secure: true

management:
  health:
    # Redis is a declared dependency that **nothing in the codebase uses yet** --
    # it is there for the phase 11 rate limiter. Left enabled, its health
    # contributor reports DOWN whenever no Redis is reachable, which takes the
    # whole readiness probe with it and stops the service from ever receiving
    # traffic. Paying for a Redis instance to satisfy a check on a component with
    # no callers is the wrong way round; turn this back on in the same change
    # that gives Redis its first caller.
    redis:
      enabled: false
  endpoint:
    health:
      probes:
        enabled: true

server:
  forward-headers-strategy: framework

logging:
  level:
    root: WARN
    app.plotted: INFO
