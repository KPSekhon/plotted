global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: plotted-api
    metrics_path: /actuator/prometheus
    static_configs:
      # host.docker.internal reaches the API whether it is running in Compose or
      # straight from Gradle on the host, which is the common case in development.
      - targets: ['host.docker.internal:8080']
        labels:
          application: plotted-api
          environment: local
